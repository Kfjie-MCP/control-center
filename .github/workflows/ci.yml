name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kfjie-MCP/mailbridge
          path: .test-mailbridge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          MAILBRIDGE_DOWNLOAD_MODULE: ${{ github.workspace }}/.test-mailbridge/gateway/src/downloads.mjs
