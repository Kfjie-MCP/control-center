location = /center { return 302 /center/; }
location ^~ /center/ {
    proxy_pass http://127.0.0.1:3186;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    client_max_body_size 2m;
}
location ^~ /connect/ {
    # OAuth queries and attachment capability URLs must not enter access logs.
    access_log off;
    proxy_pass http://127.0.0.1:3186;
    include /etc/nginx/snippets/mcp-streamable-http.conf;
    client_max_body_size 2m;
}
location ^~ /.well-known/oauth-authorization-server/connect/ {
    proxy_pass http://127.0.0.1:3186;
    proxy_set_header Host $host;
}
location ^~ /.well-known/oauth-protected-resource/connect/ {
    proxy_pass http://127.0.0.1:3186;
    proxy_set_header Host $host;
}
